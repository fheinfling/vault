# Dependabot version updates. The project has no package dependencies by design, so this mainly
# keeps the GitHub Actions used in CI current. New versions wait 14 days before they are proposed,
# so a freshly published (possibly compromised) release is never picked up on day one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Owned by the vendored code_quality kit and overwritten on every kit update; its actions are
    # bumped upstream in the kit.
    exclude-paths:
      - .github/workflows/quality-gate.yml
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
