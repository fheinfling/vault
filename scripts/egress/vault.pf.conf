# pf anchor "vault": outbound allowlist for processes whose effective group is `vault`.
#
# The installed vault binary is setgid `vault` (see README.md), so every socket a sync opens
# carries that group, and pf can match it. The owner's own login session is not affected.
# Hostnames in vault.hosts resolve when the table loads; refresh it when providers move.

table <vault_allow> persist file "/etc/pf.anchors/vault.hosts"

# Providers on 443, nothing else. No DNS rule: on macOS, name lookups go through the system
# resolver daemon (mDNSResponder), which runs as its own user and is not matched by `group vault`.
pass out quick proto tcp from any to <vault_allow> port 443 group vault flags S/SA keep state
block out log quick proto { tcp udp icmp } from any to any group vault
